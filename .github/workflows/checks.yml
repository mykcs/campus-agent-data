name: Public notice parser and health tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install parser dependency
        run: python -m pip install "beautifulsoup4==4.14.2"
      - name: Deterministic collector and failure-mode tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax checks
        run: python -m compileall -q scripts

      - name: Read-only live smoke (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cp data/notices.json /tmp/campus-smoke-notices.json
          python scripts/collect.py --output /tmp/campus-smoke-notices.json --checks-output /tmp/campus-smoke-health.json --fast
          python -c 'import json; d=json.load(open("/tmp/campus-smoke-notices.json")); print("LIVE",len(d["notices"]),[(s["id"],s["status"],s["count"]) for s in d["sources"]])'
