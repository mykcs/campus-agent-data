name: Public notice parser and health tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install parser dependency
        run: python -m pip install "beautifulsoup4==4.14.2"
      - name: Deterministic collector and failure-mode tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax checks
        run: python -m compileall -q scripts
