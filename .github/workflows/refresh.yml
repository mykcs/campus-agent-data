name: Refresh public ZJU admissions notices

on:
  workflow_dispatch:
  schedule:
    # Asia/Shanghai: odd-numbered hours, with offset to avoid minute-zero load.
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: campus-notices-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout public data repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install "beautifulsoup4==4.14.2"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect publicly accessible pages and health receipt
        id: collect
        continue-on-error: true
        run: python scripts/collect.py
      - name: Commit data and bounded health receipts
        # Run even when a source is degraded, so public failure records
        # are not lost to a preceding collector non-zero exit code.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notices.json data/health-checks.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: refresh public notices and health receipt"
            git push
          fi
      - name: Fail if public-source collection degraded or aborted
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          echo "Collector outcome: $COLLECT_OUTCOME"
          if [ "$COLLECT_OUTCOME" != "success" ]; then
            echo "::error::Public source collection failed or degraded; inspect health-checks.json"
            exit 1
          fi
